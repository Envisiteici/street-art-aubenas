<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ef8f75">
  <meta name="description" content="Carnet d'exploration de la visite Street Art à Aubenas">
  <title>Carnet d'exploration — Street Art à Aubenas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-backdrop" aria-hidden="true"></div>

  <main class="page">
    <header class="hero">
      <p class="eyebrow" id="visit-title">Street Art à Aubenas</p>

      <div class="title-wrap">
        <h1 id="notebook-title">Carnet d'exploration</h1>
        <svg class="title-underline" viewBox="0 0 320 22" aria-hidden="true">
          <path d="M3 13 C58 7,112 17,168 10 S268 8,317 12"
                fill="none"
                stroke="#ffffff"
                stroke-width="5"
                stroke-linecap="round"/>
        </svg>
      </div>

      <p class="intro" id="intro-text"></p>
    </header>

    <section class="progress-card" aria-label="Votre progression">
      <div class="progress-line">
        <strong id="progress-top-text">0 / 0 œuvres repérées</strong>
        <span id="progress-top-percent">0 %</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-top-fill"></div>
      </div>
    </section>

    <section aria-labelledby="works-heading">
      <h2 class="visually-hidden" id="works-heading">Œuvres à repérer</h2>
      <div class="works-list" id="works-list"></div>
    </section>

    <section class="progress-card progress-card-bottom" aria-label="Votre progression finale">
      <div class="progress-line">
        <strong id="progress-bottom-text">0 / 0 œuvres repérées</strong>
        <span id="progress-bottom-percent">0 %</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-bottom-fill"></div>
      </div>
    </section>

    <section class="bonus-card" id="bonus-card" hidden>
      <span class="bonus-star" aria-hidden="true">★</span>
      <div>
        <p class="bonus-label">Œuvre bonus</p>
        <h2 id="bonus-name"></h2>
        <p id="bonus-text"></p>
      </div>
    </section>

<section class="map-card">
      <p class="map-intro" id="map-text"></p>

      <a class="primary-button" id="map-link" href="#" target="_blank" rel="noopener">
        <span>Retrouver toutes les œuvres sur la carte</span>
        <svg class="map-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2V5zm6 0v14m6-14v14"/>
        </svg>
      </a>
    </section>

    

    <footer>
      <p id="update-date"></p>
      <button class="reset-button" id="reset-button" type="button">
        Remettre mes cases à zéro
      </button>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>

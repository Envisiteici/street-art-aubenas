<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e86f5a">
  <meta name="description" content="Carnet d'exploration de la visite Street Art à Aubenas">
  <title>Carnet d'exploration — Street Art à Aubenas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow" id="visit-title">Street Art à Aubenas</p>
      <h1 id="notebook-title">Carnet d'exploration</h1>
      <p class="intro" id="intro-text"></p>
    </header>

    <section class="progress-card" aria-label="Votre progression">
      <div class="progress-line">
        <strong id="progress-top-text">0 / 0 œuvres repérées</strong>
        <span id="progress-top-percent">0 %</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-top-fill"></div>
      </div>
    </section>

    <section aria-labelledby="works-heading">
      <h2 class="visually-hidden" id="works-heading">Œuvres à repérer</h2>
      <div class="works-list" id="works-list"></div>
    </section>

    <section class="progress-card progress-card-bottom" aria-label="Votre progression finale">
      <div class="progress-line">
        <strong id="progress-bottom-text">0 / 0 œuvres repérées</strong>
        <span id="progress-bottom-percent">0 %</span>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-bottom-fill"></div>
      </div>
    </section>

    <section class="map-card">
      <h2>Poursuivre l'exploration</h2>
      <p id="map-text"></p>
      <a class="primary-button" id="map-link" href="#" target="_blank" rel="noopener">
        Ouvrir la carte interactive
      </a>
    </section>

    <section class="bonus-card" id="bonus-card" hidden>
      <span class="bonus-star" aria-hidden="true">★</span>
      <div>
        <p class="bonus-label">Œuvre bonus</p>
        <h2 id="bonus-name"></h2>
        <p id="bonus-text"></p>
      </div>
    </section>

    <footer>
      <p id="update-date"></p>
      <button class="reset-button" id="reset-button" type="button">
        Remettre mes cases à zéro
      </button>
    </footer>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
